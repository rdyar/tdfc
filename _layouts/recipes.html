{% include header.html %}
<main class="site-content">
<section class="section-main">
<div class="container">
<h1 class="pad-top">{{page.title}}</h1>
<hr>
  {% if page.image %}
<img src="{{site.baseurl}}/recipe-images/{{page.image}}" class="img-responsive" alt="{{page.title}}">
  {% endif %}
  {{ content }}
<a class="btn btn-secondary btn-sm" href="https://github.com/rdyar/tdfc/tree/gh-pages/{{ page.relative_path }}">Edit this recipe on GitHub</a> <br />
<a class="btn btn-secondary btn-sm"
  id="comment-link"
  target="_blank"
>
  💬 Leave a comment
</a>
<h3 class="pad-top">Comments:</h3><hr>
{% include post_comments.html %}
<div id="comments"></div>

</div>
</section>
</main>
{% include footer.html %}

<script>
  const PATH = "{{ page.url }}";
  const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQFiZsdiSfpweFujBfp-H4TD_-6SVdU4lkuUoRBYnt3UsDOr_xFZc0RT5AqNk_FIdBRkkN6JCIYWJPb/pub?gid=1274664430&single=true&output=csv";
  
  // Format timestamp from "1/2/2026 13:45:12" to "1/2/2026 1:45 PM"
  function formatTimestamp(timeString) {
    try {
      // Parse the date string (format: "M/D/YYYY HH:MM:SS")
      const [datePart, timePart] = timeString.split(' ');
      if (!datePart || !timePart) return timeString;
      
      const [month, day, year] = datePart.split('/');
      const [hours, minutes] = timePart.split(':');
      
      const hour24 = parseInt(hours, 10);
      const hour12 = hour24 === 0 ? 12 : hour24 > 12 ? hour24 - 12 : hour24;
      const ampm = hour24 >= 12 ? 'PM' : 'AM';
      
      return `${month}/${day}/${year} ${hour12}:${minutes} ${ampm}`;
    } catch (e) {
      // If parsing fails, return original string
      return timeString;
    }
  }
  
  // Simple CSV parser that handles quoted fields
  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < row.length; i++) {
      const char = row[i];
      const nextChar = row[i + 1];
      
      if (char === '"') {
        if (inQuotes && nextChar === '"') {
          // Escaped quote
          current += '"';
          i++; // Skip next quote
        } else {
          // Toggle quote state
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        // Field separator
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    
    // Add last field
    result.push(current.trim());
    return result;
  }
  
  fetch(SHEET_URL)
    .then(r => r.text())
    .then(csv => {
      const rows = csv.split("\n").slice(1).filter(row => row.trim());
      const comments = rows
        .map(parseCSVRow)
        .filter(cols => cols.length >= 4 && cols[3] === PATH);
      
      
      if (!comments.length) {
       
        return;
      }
  
      document.getElementById("comments").innerHTML =
        comments.map(([time, name, comment, path]) =>
          `<p><strong>${name}</strong><small> - ${formatTimestamp(time)}</small><br>${comment} </p>`
        ).join("");
    })
    .catch(error => {
      console.error('Error fetching comments:', error);
      document.getElementById("comments").innerHTML =
        "<p>Error loading comments. Please try again later.</p>";
    });
  </script>
<script>
  const formBase =
    "https://docs.google.com/forms/d/e/1FAIpQLSdu9lc91upNA37X3fOS33vk6v35XuTkVBhNU0DMyVv-orJGjQ/viewform?usp=pp_url&entry.1168403230=";

  document.getElementById("comment-link").href =
    formBase + encodeURIComponent("{{ page.url }}");
</script>
